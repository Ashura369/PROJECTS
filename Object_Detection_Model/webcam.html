<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0e1117; color: #ffffff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; align-items: center; justify-content: center; width: 100%; max-width: 900px; }
    .btn { background: #ff4b4b; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #ff2b2b; }
    .btn-stop { background: #31333f; }
    .btn-stop:hover { background: #41444c; }
    .stat-badge { background: #262730; padding: 6px 12px; border-radius: 6px; font-size: 13px; border: 1px solid #363945; }
    .slider-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .slider-wrap input { accent-color: #ff4b4b; }
    .video-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #1a1c24; border-radius: 12px; overflow: hidden; border: 1px solid #363945; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 16px; color: #aaa; text-align: center; }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ff4b4b; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="controls">
    <button id="startBtn" class="btn" onclick="startCamera()">▶ Start Camera</button>
    <button id="stopBtn" class="btn btn-stop" onclick="stopCamera()" disabled>⏹ Stop</button>
    <button class="btn btn-stop" onclick="toggleMirror()">🔄 Flip Mirror</button>
    <div class="slider-wrap">
      <label>Confidence: <b id="confVal">50%</b></label>
      <input type="range" id="confSlider" min="20" max="90" value="50" oninput="updateConf(this.value)">
    </div>
    <div class="stat-badge">FPS: <b id="fpsText">0</b></div>
    <div class="stat-badge">Detected: <b id="countText">0</b> objects</div>
  </div>

  <div class="video-container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Loading AI Model (WebGL Accelerated)...</div>
    </div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <script>
    let model = null;
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('overlay');
    let ctx = canvas.getContext('2d');
    let stream = null;
    let isRunning = false;
    let minConf = 0.50;
    let isMirrored = true;
    let lastTime = performance.now();
    let frameCount = 0;

    cocoSsd.load().then(loadedModel => {
      model = loadedModel;
      document.getElementById('loading').style.display = 'none';
    });

    function updateConf(val) {
      minConf = val / 100;
      document.getElementById('confVal').innerText = val + '%';
    }

    function toggleMirror() {
      isMirrored = !isMirrored;
      video.style.transform = isMirrored ? 'scaleX(-1)' : 'scaleX(1)';
      canvas.style.transform = isMirrored ? 'scaleX(-1)' : 'scaleX(1)';
    }

    async function startCamera() {
      if (!model) return alert("Model is still loading, please wait a moment...");
      
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1920, min: 1280 },
            height: { ideal: 1080, min: 720 },
            facingMode: "user"
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;

        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        detectFrame();
      } catch (err) {
        alert("Camera access denied: " + err.message);
      }
    }

    function stopCamera() {
      isRunning = false;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('fpsText').innerText = '0';
      document.getElementById('countText').innerText = '0';
    }

    async function detectFrame() {
      if (!isRunning) return;

      const predictions = await model.detect(video);

      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        document.getElementById('fpsText').innerText = frameCount;
        frameCount = 0;
        lastTime = now;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let detectedCount = 0;

      predictions.forEach(p => {
        if (p.score >= minConf) {
          detectedCount++;
          const [x, y, width, height] = p.bbox;

          ctx.strokeStyle = '#00FF66';
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, width, height);

          const label = `${p.class.toUpperCase()} ${Math.round(p.score * 100)}%`;
          ctx.font = 'bold 16px sans-serif';
          const textWidth = ctx.measureText(label).width;
          ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          ctx.fillRect(x, y - 28, textWidth + 12, 26);

          ctx.fillStyle = '#00FF66';
          ctx.fillText(label, x + 6, y - 9);
        }
      });

      document.getElementById('countText').innerText = detectedCount;

      if (isRunning) {
        requestAnimationFrame(detectFrame);
      }
    }
  </script>
</body>
</html>
